name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on the release-please branch: PRs opened with the built-in GITHUB_TOKEN do not
  # trigger workflows, and these checks are required to merge the release PR.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Re-attach installers to an existing release (e.g. v1.2.0). Run from that tag. Leave empty for a normal CI run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts (native builds) are not needed for unit tests.
      - run: npm ci --ignore-scripts
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures

  integration:
    name: Real audio backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # Runners have no sound card: give Linux a virtual one (PulseAudio null sink behind ALSA).
      - name: Virtual sound card (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio pulseaudio-utils alsa-utils libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          # Route ALSA's default device through PulseAudio (there is no hardware card 0).
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          amixer

      - name: Audio devices (diagnostics)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            osascript -e 'get volume settings' || true
          else
            powershell -NoProfile -Command "Get-Service Audiosrv | Format-List Name,Status; Get-CimInstance Win32_SoundDevice | Format-Table Name,Status" || true
            ./impl/windows/adjust_get_current_system_volume_vista_plus.exe || true
          fi

      # Hosted Windows runners have no audio endpoint (helper reports 0x80070490). There we verify
      # that the bundled helper executes and that the missing device is reported clearly.
      - name: Integration tests against the OS audio stack
        env:
          RV_INTEGRATION: ${{ runner.os == 'Windows' && 'no-device' || '1' }}
        run: npm run test:integration

  core:
    name: Audio core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            integration: '1'
          # Hosted Windows runners have no audio endpoint (HRESULT 0x80070490): test that path.
          - os: windows-latest
            integration: no-device
          - os: macos-latest
            integration: '1'
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libpulse for building, plus a virtual sound card: a PulseAudio null sink as default output.
      - name: libpulse and a virtual sound card (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse-dev pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          pactl list short sinks

      # Hosted runners ship rustup; core/rust-toolchain.toml selects the channel.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core

      - name: Build
        run: cargo build --release

      - name: TEMP print lockfile
        if: runner.os == 'Linux'
        shell: bash
        run: echo '=====LOCK-BEGIN====='; cat Cargo.lock; echo '=====LOCK-END====='

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests, stdio protocol tests, and the audio tests selected by RV_INTEGRATION.
      - name: Test
        env:
          RV_INTEGRATION: ${{ matrix.integration }}
          RV_EXPECT_SINK: ${{ runner.os == 'Linux' && 'ci_sink' || '' }}
        run: cargo test -- --nocapture

  dependency-review:
    name: Dependency review
    # Also on manual runs of a branch (e.g. the release PR), comparing it against main.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # release-please derives versions and the changelog from commit messages on main, so the PR
      # title (squash merges) and every commit (merge commits) must follow Conventional Commits.
      - name: Check PR title and commit messages
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"; bad=1
          fi
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $re ]]; then
              echo "::error::Commit message is not a Conventional Commit: $subject"; bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          if [[ $bad == 1 ]]; then
            echo "Use e.g. 'fix: …', 'feat: …', 'feat!: …' (breaking), 'chore: …', 'ci: …', 'docs: …'." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: [test, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Apple codesigning certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_APPLE_CERT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build

      - name: Build
        if: runner.os != 'macOS'
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  # release-please keeps a release PR (version bump + CHANGELOG) up to date from the Conventional
  # Commits on main. Merging that PR makes this job create the tag and GitHub release; the builds
  # of the same run are then attached by `publish`. Uses the built-in GITHUB_TOKEN, so the release
  # PR does not trigger CI by itself: run this workflow manually on its branch before merging.
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Attach installers to release
    needs: [release-please, build, integration]
    # always(): release-please is skipped on manual runs, which must not skip this job.
    if: >-
      always() && needs.build.result == 'success' && needs.integration.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
    steps:
      # Installers must come from exactly the tagged commit.
      - name: Check that this run built the tagged commit
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG points to $tag_sha but this run built $GITHUB_SHA. Run the workflow from the tag $TAG."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload to the GitHub release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
