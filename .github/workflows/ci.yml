name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on the release-please branch: PRs opened with the built-in GITHUB_TOKEN do not
  # trigger workflows, and these checks are required to merge the release PR.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Finish a draft release that was not published (e.g. v1.2.0). Run from that tag. Leave empty for a normal CI run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against the RustSec advisory database
        working-directory: core
        run: cargo audit

  # The matrix is built at run time so an optional self-hosted Mac (real audio hardware) can be
  # switched on with the repository variable SELF_HOSTED_MACOS=true, without editing this file.
  # It only joins pushes to main: a pull request can edit this very file, so the runner group
  # (WS) is restricted to this workflow at refs/heads/main and never serves pull request runs.
  core-matrix:
    name: Audio core matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          SELF_HOSTED_MACOS: ${{ vars.SELF_HOSTED_MACOS }}
          TRUSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # name is the job name suffix: keep the hosted ones equal to the runner label (required checks).
          # Hosted Windows runners have no audio endpoint (HRESULT 0x80070490): test that path.
          matrix='[
            {"name":"ubuntu-latest","runner":"ubuntu-latest","integration":"1"},
            {"name":"windows-latest","runner":"windows-latest","integration":"no-device"},
            {"name":"macos-latest","runner":"macos-latest","integration":"1"}
          ]'
          if [ "$SELF_HOSTED_MACOS" = "true" ] && [ "$TRUSTED" = "true" ]; then
            matrix=$(jq -c '. + [{"name":"macos self-hosted","runner":["self-hosted","macOS","ARM64"],"integration":"1"}]' <<<"$matrix")
          else
            matrix=$(jq -c . <<<"$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  core:
    name: Audio core (${{ matrix.name }})
    needs: core-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.core-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libpulse for building, plus a virtual sound card: a PulseAudio null sink as default output.
      - name: libpulse and a virtual sound card (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse-dev pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          pactl list short sinks

      # Self-hosted runners run as a service with a minimal PATH; rustup must be installed there.
      - name: Add cargo to PATH (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Hosted runners ship rustup; core/rust-toolchain.toml selects the channel and components (also adds missing ones on self-hosted).
      - name: Rust toolchain
        run: rustup toolchain install

      # Not on self-hosted: cargo's registry and target dir already persist there, and the cache
      # post step hung on the self-hosted Mac (it raised a macOS password prompt).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment != 'self-hosted'
        with:
          workspaces: core

      - name: Build
        run: cargo build --release --locked


      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Unit tests, protocol tests over stdio and WebSocket, and the audio tests selected by RV_INTEGRATION.
      # On Linux the same run measures line coverage and fails below 85%: it is the one leg where a real
      # backend (PulseAudio null sink) is under test, so the gate also covers that code. The Windows and
      # macOS backends only run on their own legs and are not part of the number.
      - name: Coverage tools (Linux)
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov

      - name: Test with coverage gate (Linux)
        if: runner.os == 'Linux'
        env:
          RV_INTEGRATION: ${{ matrix.integration }}
          RV_EXPECT_SINK: ci_sink
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 85 -- --nocapture

      - name: Test
        if: runner.os != 'Linux'
        env:
          RV_INTEGRATION: ${{ matrix.integration }}
        run: cargo test --locked -- --nocapture

  dependency-review:
    name: Dependency review
    # Also on manual runs of a branch (e.g. the release PR), comparing it against main.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # release-please derives versions and the changelog from commit messages on main, so the PR
      # title (squash merges) and every commit (merge commits) must follow Conventional Commits.
      - name: Check PR title and commit messages
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"; bad=1
          fi
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $re ]]; then
              echo "::error::Commit message is not a Conventional Commit: $subject"; bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          if [[ $bad == 1 ]]; then
            echo "Use e.g. 'fix: …', 'feat: …', 'feat!: …' (breaking), 'chore: …', 'ci: …', 'docs: …'." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Release binaries for each OS: one archive and the plain program (what updates download), plus the
  # installers. The publish job attaches them to the release.
  build:
    name: Build (${{ matrix.os }})
    needs: [core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, exe: .exe, archive: zip }
          - { os: macos-latest, target: macos-arm64, exe: '', archive: tar.gz }
          - { os: ubuntu-latest, target: linux-x64, exe: '', archive: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: libpulse (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse-dev

      - name: Rust toolchain
        working-directory: core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo build --release --locked --bin remote-volume

      - name: Package
        shell: bash
        env:
          NAME: remote-volume-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp "core/target/release/remote-volume${{ matrix.exe }}" LICENSE readme.md "$NAME"/
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          mkdir upload
          mv "$NAME.${{ matrix.archive }}" upload/
          cp "core/target/release/remote-volume${{ matrix.exe }}" "upload/$NAME${{ matrix.exe }}"
          if [ "${{ runner.os }}" = Linux ]; then
            cp installer/install.sh upload/
          fi

      - name: Build the Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = (Select-String -Path core\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\core\target\release\remote-volume.exe" installer\remote-volume.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Move-Item installer\remote-volume-setup-windows-x64.exe upload\

      # The setup must leave a running, self-updating app behind, and take it away again.
      - name: Try the Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Not Start-Process -Wait: it also waits for child processes, and the installed app keeps running.
          $setup = Start-Process upload\remote-volume-setup-windows-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "The setup does not finish" }
          if ($setup.ExitCode -ne 0) { throw "The setup failed with code $($setup.ExitCode)" }
          $update = $null
          foreach ($attempt in 1..30) {
            try { $update = Invoke-RestMethod http://127.0.0.1:2502/api/update; break } catch { Start-Sleep -Seconds 1 }
          }
          if ($null -eq $update) { throw "The installed app does not answer" }
          if ($update.managed -ne $true) { throw "The installed app does not update itself: $update" }
          $run = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name 'Remote Volume'
          Write-Output "Starts at login with: $($run.'Remote Volume')"
          $folder = "$env:LOCALAPPDATA\Programs\RemoteVolume"
          $uninstaller = Start-Process "$folder\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $uninstaller.WaitForExit(120000)) { throw "The uninstaller does not finish" }
          foreach ($attempt in 1..30) {
            if (-not (Test-Path "$folder\remote-volume.exe")) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "$folder\remote-volume.exe") { throw "The uninstaller left the program behind" }
          if (Get-Process -Name remote-volume -ErrorAction SilentlyContinue) { throw "The uninstaller left the app running" }
          if ((Get-Item HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).GetValue('Remote Volume')) { throw "The uninstaller left the start at login" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30

  # release-please keeps a release PR (version bump + CHANGELOG) up to date from the Conventional
  # Commits on main. Merging that PR makes this job create the tag and a draft GitHub release;
  # `publish` then attaches the builds of the same run and publishes it. Uses the built-in
  # GITHUB_TOKEN, so the release PR does not trigger CI by itself: run this workflow manually on its
  # branch before merging.
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Attach binaries and publish release
    needs: [release-please, build, core]
    # always(): release-please is skipped on manual runs, which must not skip this job.
    if: >-
      always() && needs.build.result == 'success' && needs.core.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    # Holds UPDATE_SIGNING_KEY, and only lets main and v* tags in: no other ref can sign an update.
    environment: release
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
      # The public key built into the app (`PUBLIC_KEY` in core/src/update.rs).
      UPDATE_PUBLIC_KEY: 16d0d1aa400484aea2df89ecb456e22c5b5149f5bfa5f1f53830b6f4e758f13d
    steps:
      # Binaries must come from exactly the tagged commit, and a published release is final.
      - name: Check that this run built the tagged commit of a draft release
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG points to $tag_sha but this run built $GITHUB_SHA. Run the workflow from the tag $TAG."
            exit 1
          fi
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::$TAG is already published and must not change. Make a new release instead."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # What installed apps update from. They only accept a manifest signed with this key.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir manifest
          sum() { sha256sum "dist/$1" | cut -d ' ' -f 1; }
          jq -n --arg version "${TAG#v}" \
            --arg windows "$(sum remote-volume-windows-x64.exe)" \
            --arg macos "$(sum remote-volume-macos-arm64)" \
            --arg linux "$(sum remote-volume-linux-x64)" \
            '{version: $version, assets: {
              "windows-x64": {file: "remote-volume-windows-x64.exe", sha256: $windows},
              "macos-arm64": {file: "remote-volume-macos-arm64", sha256: $macos},
              "linux-x64": {file: "remote-volume-linux-x64", sha256: $linux}}}' > manifest/update.json
          cat manifest/update.json
          umask 077
          key="$RUNNER_TEMP/update-signing.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if [[ "$public" != "$UPDATE_PUBLIC_KEY" ]]; then
            echo "::error::UPDATE_SIGNING_KEY does not match the public key built into the app."
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$key" -in manifest/update.json -out manifest/update.json.sig

      # --clobber only replaces files of this draft, from an earlier attempt that did not finish.
      - name: Upload to the draft release
        run: gh release upload "$TAG" dist/* manifest/update.json manifest/update.json.sig --clobber --repo "$GITHUB_REPOSITORY"

      # Installed apps and install.sh read releases/latest, which skips drafts: they get all the
      # files at once. With the repository setting "Immutable releases", this also locks them.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      # The release is out either way: this reports that the repository setting was turned off.
      - name: Check that the published release is immutable
        run: |
          for attempt in 1 2 3 4 5 6; do
            immutable=$(gh release view "$TAG" --json isImmutable --jq .isImmutable --repo "$GITHUB_REPOSITORY")
            if [[ "$immutable" == "true" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$TAG is published but not immutable. Turn on Immutable releases in the repository settings."
          exit 1
