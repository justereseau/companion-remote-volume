<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
		/>
		<title>Remote Volume</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
			}

			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background-color: #121212;
				color: #ffffff;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				/* "safe" keeps the top reachable when content is taller than the window. */
				align-items: safe center;
				overflow-y: auto;
			}

			.container {
				background-color: #1e1e1e;
				padding: 20px 24px;
				width: 100%;
				min-height: 100%;
				text-align: center;
			}

			h1 {
				color: #bb86fc;
				font-size: 24px;
				margin: 0 0 8px;
			}

			label {
				display: block;
				margin: 12px 0 4px;
				font-weight: 600;
				font-size: 14px;
			}

			input[type='number'],
			input[type='text'],
			select {
				padding: 8px 10px;
				border: none;
				border-radius: 5px;
				background-color: #333333;
				color: #ffffff;
				width: 100%;
				font-size: 15px;
				transition: background-color 0.3s ease;
			}

			.checks {
				display: flex;
				justify-content: center;
				gap: 24px;
				margin-top: 14px;
			}

			.checks label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				margin: 0;
				cursor: pointer;
			}

			input[type='checkbox'] {
				width: 16px;
				height: 16px;
				margin: 0;
			}

			.row {
				display: flex;
				gap: 8px;
			}

			.row input {
				flex: 1;
				min-width: 0;
			}

			.row button {
				width: auto;
				margin-top: 0;
				padding: 0 12px;
				font-size: 14px;
			}

			.hint {
				font-size: 12px;
				color: #aaa;
				margin-top: 4px;
				overflow-wrap: anywhere;
			}

			input[type='number']:focus,
			input[type='text']:focus,
			select:focus,
			input[type='checkbox']:focus {
				outline: none;
				background-color: #444444;
			}

			button {
				background-color: #bb86fc;
				color: #ffffff;
				padding: 10px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				transition: background-color 0.3s ease, transform 0.2s ease;
				width: 100%;
				font-size: 16px;
				margin-top: 16px;
			}

			button:hover {
				background-color: #9b59b6;
				transform: translateY(-2px);
			}

			input[disabled] {
				background-color: #444444;
			}

			#status {
				min-height: 1.2em;
			}

			footer {
				margin-top: 8px;
				font-size: 12px;
				color: #999;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Remote Volume</h1>
			<label for="port">WebSocket Port:</label>
			<input type="number" id="port" value="2501" min="1" max="65535" />
			<label for="host">Accept connections from:</label>
			<select id="host">
				<option value="0.0.0.0">Network (all interfaces)</option>
				<option value="127.0.0.1">This computer only</option>
			</select>
			<label for="token">Access token (optional):</label>
			<div class="row">
				<input type="text" id="token" autocomplete="off" spellcheck="false" placeholder="none" />
				<button id="generateToken" type="button">Generate</button>
			</div>
			<div class="hint">If set, clients must connect to ws://host:port/?token=&lt;token&gt;</div>
			<div class="checks">
				<label for="runOnStartup"><input type="checkbox" id="runOnStartup" />Run on Startup</label>
				<label for="enablePolling"><input type="checkbox" id="enablePolling" />Enable Polling</label>
			</div>
			<label for="pollingInterval">Polling Interval (ms):</label>
			<input type="number" id="pollingInterval" value="1000" min="100" max="10000" disabled />
			<div class="hint">Polling picks up changes made outside the app. Commands are always pushed to all clients.</div>
			<button id="save">Save</button>
			<div id="status" class="hint" role="status"></div>

			<footer>
				Software licensed under the MIT License.<br />
				Developed by Ultimate Technology Solutions GmbH
			</footer>
		</div>

		<script src="settings.js"></script>
	</body>
</html>
