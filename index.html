<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
		/>
		<title>Remote Volume</title>
		<style>
			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background-color: #121212;
				color: #ffffff;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				overflow: hidden;
			}

			.container {
				background-color: #1e1e1e;
				padding: 30px;
				border-radius: 10px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
				width: 100%;
				max-width: 400px;
				text-align: center;
			}

			h1 {
				color: #bb86fc;
				margin-bottom: 20px;
			}

			label {
				display: block;
				margin: 15px 0 5px;
				font-weight: bold;
			}

			input[type='number'],
			input[type='text'],
			select,
			input[type='checkbox'] {
				margin-top: 5px;
				padding: 10px;
				border: none;
				border-radius: 5px;
				background-color: #333333;
				color: #ffffff;
				width: calc(100% - 20px);
				font-size: 16px;
				transition: background-color 0.3s ease;
			}

			input[type='checkbox'] {
				width: auto;
				margin-right: 10px;
			}

			select {
				width: 100%;
			}

			.row {
				display: flex;
				gap: 8px;
			}

			.row button {
				width: auto;
				margin-top: 5px;
				padding: 0 12px;
				font-size: 14px;
			}

			.hint {
				font-size: 12px;
				color: #aaa;
				margin-top: 4px;
			}

			input[type='number']:focus,
			input[type='text']:focus,
			select:focus,
			input[type='checkbox']:focus {
				outline: none;
				background-color: #444444;
			}

			button {
				background-color: #bb86fc;
				color: #ffffff;
				padding: 10px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				transition: background-color 0.3s ease, transform 0.2s ease;
				width: 100%;
				font-size: 16px;
				margin-top: 20px;
			}

			button:hover {
				background-color: #9b59b6;
				transform: translateY(-2px);
			}

			input[disabled] {
				background-color: #444444;
			}

			footer {
				margin-top: 20px;
				font-size: 14px;
				color: #bbb;
			}

			@media (max-width: 600px) {
				.container {
					padding: 20px;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Remote Volume</h1>
			<label for="port">WebSocket Port:</label>
			<input type="number" id="port" value="2501" min="1" max="65535" />
			<label for="host">Accept connections from:</label>
			<select id="host">
				<option value="0.0.0.0">Network (all interfaces)</option>
				<option value="127.0.0.1">This computer only</option>
			</select>
			<label for="token">Access token (optional):</label>
			<div class="row">
				<input type="text" id="token" autocomplete="off" spellcheck="false" placeholder="none" />
				<button id="generateToken" type="button">Generate</button>
			</div>
			<div class="hint">If set, clients must connect to ws://host:port/?token=&lt;token&gt;</div>
			<br />
			<label for="runOnStartup">
				<input type="checkbox" id="runOnStartup" />
				Run on Startup
			</label>
			<br />
			<label for="enablePolling">
				<input type="checkbox" id="enablePolling" />
				Enable Polling
			</label>
			<br />
			<label for="pollingInterval">Polling Interval (ms):</label>
			<input type="number" id="pollingInterval" value="1000" min="100" max="10000" disabled />
			<br />
			<button id="save">Save</button>
			<div id="status" class="hint" role="status"></div>

			<footer>
				Software licensed under the MIT License.<br />
				Developed by Ultimate Technology Solutions GmbH
			</footer>
		</div>

		<script src="settings.js"></script>
	</body>
</html>
