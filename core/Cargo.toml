[package]
name = "remote-volume-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "OS audio core for Remote Volume: line-delimited JSON over stdio"
license = "MIT"
publish = false

[[bin]]
name = "remote-volume-core"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Shell_PropertiesSystem",
]

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
