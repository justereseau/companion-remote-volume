[package]
name = "remote-volume-core"
version = "1.9.1"
edition = "2021"
rust-version = "1.80"
description = "OS audio core for Remote Volume: line-delimited JSON over stdio"
license = "MIT"
publish = false

[lib]
name = "remote_volume_core"
path = "src/lib.rs"

# The sidecar of the Electron app (stdio JSON, see CONTRACT.md).
[[bin]]
name = "remote-volume-core"
path = "src/main.rs"

# The all-Rust app: WebSocket server for Companion plus a local settings page.
[[bin]]
name = "remote-volume"
path = "src/bin/remote-volume.rs"

[dependencies]
futures-util = "0.3.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-tungstenite = "0.30.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Must be the same version of windows-core that the `windows` crate below depends on: the code
# generated by #[implement] names this crate, and two versions make the COM traits not match.
# Bump both together, when `windows` moves to a new windows-core.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
